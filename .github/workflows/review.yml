name: bcr-pr-reviewer-poc
on:
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./local-action/actions/bcr-pr-reviewer
        with:
          token: ${{ secrets.BCR_POC_TOKEN }}
          action-type: review_prs
