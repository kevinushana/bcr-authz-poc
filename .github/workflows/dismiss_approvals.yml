name: dismiss_approvals
on:
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: write
jobs:
  dismiss:
    runs-on: ubuntu-latest
    steps:
      - uses: bazelbuild/continuous-integration/actions/bcr-pr-reviewer@bd6a90eceb738c010fd1a9b472e8b6c894e6ea4e
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          action-type: dismiss_approvals
